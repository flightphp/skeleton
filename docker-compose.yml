version: '3.7'

services:
    flight:
        image: php:8-alpine
        working_dir: /var/www
        command: php -S 0.0.0.0:8080 -t public
        environment:
            APP_ENV: development
            APP_DEBUG: "true"
            DB_DRIVER: sqlite
            DB_SQLITE_PATH: /var/www/database.sqlite
        ports:
            - "8080:8080"
        volumes:
            - .:/var/www
